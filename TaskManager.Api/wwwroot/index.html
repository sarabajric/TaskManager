<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Task Manager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e0ecf8, #f0f4f8);
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px;
      color: #1f2937;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
      background: #ffffff;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 4px 0; color: #2E74B5; }
    .counter { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
    form { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 15px;
    }
    input[type="text"]:focus {
      outline: none;
      border-color: #2E74B5;
      box-shadow: 0 0 0 3px rgba(46, 116, 181, 0.2);
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #2E74B5;
      color: #ffffff;
      font-size: 14px;
      cursor: pointer;
    }
    button:hover { background: #245d93; }
    button.delete-button { background: #ef4444; }
    button.delete-button:hover { background: #dc2626; }
    .actions { display: flex; gap: 8px; }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      border-left: 4px solid #cbd5e1;
    }
    li.inprogress { border-left-color: #f59e0b; }
    li.done { border-left-color: #16a34a; }
    .info { display: flex; flex-direction: column; gap: 6px; }
    .title { font-weight: bold; }
    .badge {
      align-self: flex-start;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #374151;
    }
    li.inprogress .badge { background: #fef3c7; color: #92400e; }
    li.done .badge { background: #dcfce7; color: #166534; }
    li.done .title { text-decoration: line-through; color: #9ca3af; }
    .error { color: #dc2626; margin-bottom: 12px; min-height: 18px; }
    .empty { text-align: center; color: #9ca3af; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Task Manager</h1>
    <div class="counter" id="task-count" data-testid="task-count"></div>

    <form id="task-form">
      <input type="text" id="task-title" placeholder="Naziv zadatka" />
      <button type="submit" id="add-button">Dodaj</button>
    </form>

    <div class="error" id="error-message"></div>

    <ul id="task-list"></ul>
    <div class="empty" id="empty-message" data-testid="empty-message" style="display:none">
      Nema zadataka. Dodaj prvi!
    </div>
  </div>

  <script>
    const API_URL = "/api/tasks";
    const list = document.getElementById("task-list");
    const form = document.getElementById("task-form");
    const titleInput = document.getElementById("task-title");
    const errorBox = document.getElementById("error-message");
    const counter = document.getElementById("task-count");
    const emptyMessage = document.getElementById("empty-message");

    // Dohvata sve zadatke s API-ja i iscrtava listu
    async function loadTasks() {
      const response = await fetch(API_URL);
      const tasks = await response.json();
      list.innerHTML = "";

      // Brojač i poruka za praznu listu
      const doneCount = tasks.filter(t => t.status === "Done").length;
      counter.textContent = `Ukupno: ${tasks.length} | Završeno: ${doneCount}`;
      emptyMessage.style.display = tasks.length === 0 ? "block" : "none";

      for (const task of tasks) {
        const li = document.createElement("li");
        li.setAttribute("data-testid", "task-item");
        if (task.status === "Done") li.classList.add("done");
        if (task.status === "InProgress") li.classList.add("inprogress");

        const info = document.createElement("div");
        info.className = "info";

        const title = document.createElement("span");
        title.className = "title";
        title.textContent = task.title;

        const status = document.createElement("span");
        status.className = "badge status";
        status.textContent = task.status;

        info.append(title, status);
        li.appendChild(info);

        const actions = document.createElement("div");
        actions.className = "actions";

        // Dugme "Završi" se prikazuje samo ako zadatak još nije gotov
        if (task.status !== "Done") {
          const doneButton = document.createElement("button");
          doneButton.textContent = "Završi";
          doneButton.className = "complete-button";
          doneButton.addEventListener("click", () => completeTask(task));
          actions.appendChild(doneButton);
        }

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Obriši";
        deleteButton.className = "delete-button";
        deleteButton.addEventListener("click", () => deleteTask(task.id));
        actions.appendChild(deleteButton);

        li.appendChild(actions);
        list.appendChild(li);
      }
    }

    // Dodaje novi zadatak (POST)
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorBox.textContent = "";

      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: titleInput.value })
      });

      if (!response.ok) {
        errorBox.textContent = "Naziv zadatka je obavezan.";
        return;
      }

      titleInput.value = "";
      await loadTasks();
    });

    // Postavlja status zadatka na Done (PUT)
    async function completeTask(task) {
      await fetch(`${API_URL}/${task.id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...task, status: "Done" })
      });
      await loadTasks();
    }

    // Briše zadatak (DELETE)
    async function deleteTask(id) {
      await fetch(`${API_URL}/${id}`, { method: "DELETE" });
      await loadTasks();
    }

    loadTasks();
      </script>
</body>
</html>
