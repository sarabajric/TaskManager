name: CI

# Pokreće se na svaki push i pull request prema grani main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1) Skida kod iz repozitorija na GitHubov virtualni računar
      - name: Checkout
        uses: actions/checkout@v4

      # 2) Instalira .NET 10 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 3) Vraća NuGet pakete i gradi projekat
      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # 4) Instalira Chromium za Playwright (potreban za UI testove)
      - name: Install Playwright browsers
        run: pwsh TaskManager.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # 5) Pokreće sve testove (unit, API i UI)
      - name: Test
        run: dotnet test --no-build